model:
  baseline: "本仓库 src/so-101_description"
  variant: "SO-101 架构，比赛改型末端，当前 URDF 为 5 个转动关节"
  root_frame: "base_footprint"
  base_frame: "base_link"
  tcp_frame: "end_effector"
  joint_names:
    - J1_Rotation
    - J2_Shoulder_Pitch
    - J3_Elbow_Pitch
    - J4_Wrist_Pitch
    - J5_Wrist_Roll
  joint_limits_rad: [-1.57, 1.57]
  approximate_mount_to_tcp_upper_bound_m: 0.527

mass:
  urdf_arm_without_camera_kg: 0.571394
  urdf_camera_and_holder_kg: 0.035
  urdf_arm_with_camera_kg: 0.606394
  flight_budget_range_kg: [3.0, 4.0]
  flight_budget_nominal_kg: 3.5
  status: "飞行预算来自项目当前估计；URDF 惯性尚未按实物称重标定"

actuation:
  purchased_servo: "Feetech ST-3215-C018"
  quantity: 6
  voltage_v: 12
  gear_ratio: "1:345"
  stall_torque_kg_cm: 30
  rated_torque_kg_cm: 10
  no_load_current_each_a: 0.18
  rated_current_each_a: 0.9
  stall_current_each_a: 2.7
  protocol: "TTL 半双工异步串行，8N1"
  default_baudrate_bps: 1000000
  note: "采购 6 个舵机；当前 URDF 只有 5 个转动关节，第 6 个末端执行器自由度待末端方案冻结后再入模"

controller:
  model: "Waveshare Bus Servo Adapter (A), SKU 25514"
  host_interfaces: ["USB-C 转串口（CH343）", "UART"]
  input_voltage_v: [9.0, 12.6]
  maximum_board_current_a: 5
  motor_power_from_usb: false

power_supply:
  actual_type: "12 V 稳压电源适配器"
  output_voltage_v: 12
  maximum_output_current_a: 2
  maximum_output_power_w: 24
  connector: "DC5521，中心正极"
  suitability: "可用于空载通信、标定和轻载动作；六关节同时受载前必须实测电流与压降"

camera:
  model: "32 x 32 mm UVC 单目相机，720p，90°广角"
  host_interface: "独立 USB/UVC"
  power_and_current: "采购清单未给出，待到货实测"

must_confirm_before_freeze:
  - "整臂实际总重：含末端、相机、控制板、线束、安装件"
  - "收拢和典型伸展姿态下，相对 base_footprint 的重心"
  - "第 6 个舵机在比赛末端中的用途、关节轴和行程"
  - "12 V / 2 A 适配器下典型动作的峰值电流、最低母线电压和是否发生复位"
  - "无人机电机数量、X2216 的 KV、8 寸桨型号、电池电压和实测拉力曲线"
